# Four sanitizer lanes across three toolchains: twelve jobs. The kill-point
# sweep adds three more on the same toolchains; format and library-only are one
# each.
#
# The lanes are not variations on a theme. cpp-test is the UNINSTRUMENTED
# CONTROL that makes the other three mean something: without it, a red under
# ASan is not attributable, because "the code is broken" and "the code has a
# memory error" look identical in an exit code.
#
# Each lane asserts AT COMPILE TIME that it has the sanitizer it claims -- and
# cpp-test asserts it has none. See test/sanitizer_lane_test.cc. A lane that
# lost its -fsanitize flag to a CMake edit fails to BUILD rather than passing
# quietly, which is the failure mode a sanitizer lane is most exposed to: it
# keeps building, keeps running, keeps passing, and checks nothing at all.
#
# NO NETWORK IS NEEDED TO BUILD. GoogleTest is vendored at
# third_party/googletest. The checkout is the only fetch in this file.
#
# GCC WAS ADDED AND IT FOUND TWO THINGS IMMEDIATELY, which is the argument for
# it. libstdc++ does not pull <algorithm> in behind another header the way
# libc++ does, so a missing include compiled under clang for as long as clang
# was the only compiler; and -Wdangling-else, which clang does not raise here,
# named an unbraced `if (cond) EXPECT_TRUE(...)` -- a shape whose macro expands
# to an if/else. Both are fixed. Neither was reachable from a green clang run.
#
# The gcc TSan lane runs on Linux only because that is the only place it is in
# the matrix. Homebrew's macOS gcc ships libasan and libubsan but no libtsan,
# so a macOS gcc job could not have run it.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # CHEAPEST LANE, FIRST: if the vendored tree is not the tree we recorded,
  # nothing below is about the code we think it is.
  #
  # A PIN NOTHING VERIFIES IS A COMMENT. third_party/googletest/VERSION has
  # recorded a tag, a commit and a tree hash since the tree was vendored, and
  # nothing compared them to the bytes on disk. A local edit to a vendored
  # dependency would have survived every lane in this file and surfaced later as
  # a build that behaves differently here than anywhere else.
  #
  # OFFLINE, AND THAT IS THE DESIGN. It answers "is this the tree we recorded",
  # which is local. Whether those bytes are what upstream published needs the
  # network, is answered when a dependency is vendored or re-pinned, and is
  # deliberately not a lane -- a lane that fetches fails in exactly the
  # situation where "it builds from a clean clone" matters most.
  vendor:
    name: vendored-tree integrity (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/vendor-check.sh

  lanes:
    name: ${{ matrix.lane.name }} (${{ matrix.platform.os }}, ${{ matrix.platform.cc }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        # THREE TOOLCHAINS, BECAUSE THE STANDARD LIBRARY IS THE VARIABLE.
        # libstdc++ and libc++ do not agree about which headers include which
        # others, so a missing <algorithm> compiles on one and not the other.
        # That is not hypothetical here: it is what the first gcc build found.
        platform:
          - { os: ubuntu-latest, cc: clang, cxx: clang++ }
          - { os: ubuntu-latest, cc: gcc,   cxx: g++ }
          - { os: macos-latest,  cc: clang, cxx: clang++ }
        lane:
          # The control. It BUILDS the TSan harness and deliberately does not
          # run it: building it here is what makes this lane a real control for
          # cpp-tsan, so a red there is the race and not a broken build.
          # Running it here would defeat that -- the harness races on purpose
          # under an unlocked mutant, and cpp-test would go red too.
          - name: cpp-test
            sanitizer: none
            targets: basalt_test basalt_tsan_harness
            run: basalt_test
            opts: ''
          # THE C ABI, COMPILED BY A C COMPILER. Everything else in this matrix
          # is C++, so every assertion any of them makes about
          # include/basalt/basalt.h is made by a compiler reading it through
          # `extern "C"` -- which says nothing about whether a C compiler can.
          # A `//` comment, a default argument, an `enum class`, a bare struct
          # name: each compiles silently in the lanes above and stops the
          # header dead in the one language it exists for. Calling every
          # function additionally proves each symbol has C linkage in the
          # archive, which is a fact about the build and not about the header.
          - name: c-abi
            sanitizer: none
            targets: basalt_c_abi_test
            run: basalt_c_abi_test
            opts: ''
          - name: cpp-asan
            sanitizer: address
            targets: basalt_test
            run: basalt_test
            opts: 'ASAN_OPTIONS=abort_on_error=0:detect_leaks=0'
          - name: cpp-ubsan
            sanitizer: undefined
            targets: basalt_test
            run: basalt_test
            opts: 'UBSAN_OPTIONS=print_stacktrace=1'
          # THE THREAD LANE RUNS THE HARNESS AND NOT THE UNIT SUITE. The unit
          # suite is single-threaded, so a green TSan run over it would report
          # the absence of threads as the absence of races.
          - name: cpp-tsan
            sanitizer: thread
            targets: basalt_tsan_harness
            run: basalt_tsan_harness
            opts: 'TSAN_OPTIONS=halt_on_error=1'
    env:
      CC: ${{ matrix.platform.cc }}
      CXX: ${{ matrix.platform.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: compiler version
        run: $CXX --version

      - name: configure
        run: cmake -S . -B build -DBASALT_SANITIZER=${{ matrix.lane.sanitizer }}

      # getconf rather than nproc: nproc is coreutils and is not on the macOS
      # runner.
      - name: build
        run: |
          cmake --build build --target ${{ matrix.lane.targets }} \
                -j "$(getconf _NPROCESSORS_ONLN)"

      - name: run
        run: env ${{ matrix.lane.opts }} ./build/${{ matrix.lane.run }}

  # THE KILL-POINT SWEEP, WHICH IS THE CHECK BEHIND THE DURABILITY CLAIM AND
  # WHICH NOTHING RAN.
  #
  # `basalt_sweep` was reachable from no job. Each lane above builds only the
  # target it runs, and `library-only` configures with BASALT_BUILD_TESTS=OFF,
  # which does not define the tool at all -- so the program that enumerates every
  # point a write can be interrupted at was compiled by nobody and executed by
  # nobody, while the claim it exists to support was the headline one.
  #
  # ALL THREE REGIMES, NAMED SEPARATELY, BECAUSE THEY REACH DIFFERENT CALL
  # SITES. `default` sweeps the six-key WAL workload (305 points). `flush`
  # crosses the flush threshold so every Env call a flush issues becomes a kill
  # point (990). `compact` crosses the L0 trigger with a SNAPSHOT HELD ACROSS IT,
  # so both halves of file lifetime are on the swept path (3545). A green
  # `default` says nothing whatever about the compaction path, which is the one
  # that deletes data.
  #
  # IT IS DETERMINISTIC AND TAKES NEITHER A SEED NOR AN ITERATION COUNT. The
  # workload keys are authored, the torn-write prefixes are a fixed list, and the
  # number of points is a function of the workload rather than of a budget --
  # rig/sweep.cc: "a deterministic sweep with authored prefixes replays, and a
  # randomized one does not." Three runs of each regime are byte-identical, so a
  # red here is a change in the engine and never a reroll.
  #
  # ABOUT 17 SECONDS FOR ALL THREE, UNINSTRUMENTED. That is the whole reason this
  # is an on-push lane and not a nightly schedule: a durability check that runs
  # once a night is a durability check that tells you which of the day's twenty
  # merges broke it, and the answer is "one of them".
  sweep:
    name: kill-point sweep (${{ matrix.platform.os }}, ${{ matrix.platform.cc }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, cc: clang, cxx: clang++ }
          - { os: ubuntu-latest, cc: gcc,   cxx: g++ }
          - { os: macos-latest,  cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.platform.cc }}
      CXX: ${{ matrix.platform.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: compiler version
        run: $CXX --version

      - name: configure
        run: cmake -S . -B build

      - name: build
        run: |
          cmake --build build --target basalt_sweep \
                -j "$(getconf _NPROCESSORS_ONLN)"

      # ONE REGIME PER INVOCATION -- the tool refuses to aggregate two, and each
      # gets its own step so the log names the regime that failed rather than
      # making a reader find it in the output. `basalt_sweep` exits non-zero on a
      # violation, on a recovery set that has degenerated to one element, and on
      # a census that disagrees with the visit count.
      - name: sweep, default regime
        run: ./build/basalt_sweep default cxx

      - name: sweep, flush regime
        run: ./build/basalt_sweep flush cxx

      - name: sweep, compact regime
        run: ./build/basalt_sweep compact cxx

      # AND THE SAME THREE THROUGH THE C BOUNDARY, BECAUSE A DURABILITY CLAIM
      # THAT STOPS AT THE C BOUNDARY HAS A HOLE IN IT.
      #
      # Everything above sweeps basalt::DB. Every embedder that is not written
      # in C++ reaches the same Env calls through basalt/basalt.h, running a
      # boundary that copies, handles that own, and an iterator that holds a
      # pair back when a buffer is short -- none of which the three lanes above
      # touch, and all of which is on the path that embedder's data takes.
      #
      # THE COUNTS DIFFER FROM THE cxx LANES ON PURPOSE, and by an amount that
      # is accounted for rather than tolerated: exactly five points per regime,
      # which is one ordinal (the CreateDir the C open performs) at five modes.
      # They are separate invocations because the two ordinal spaces are
      # different and their numbers must never be pooled -- section 8.4's rule
      # about regimes, applied to the other axis.
      - name: sweep through the C ABI, default regime
        run: ./build/basalt_sweep default c

      - name: sweep through the C ABI, flush regime
        run: ./build/basalt_sweep flush c

      - name: sweep through the C ABI, compact regime
        run: ./build/basalt_sweep compact c

  # THE DIFFERENTIAL DRIVER PRODUCES AN ARTIFACT, AND THE FORMAT IS FROZEN.
  #
  # `basalt_diff` runs a seeded workload, kills at a chosen Env ordinal, reopens
  # and writes an artifact. It reaches NO VERDICT -- judging is a separate
  # process in a different language, and this side cannot compute what a model
  # would have held. So the most this repository can assert on its own is that
  # the tool RUNS and that what it writes still parses as the frozen format.
  #
  # That is worth a lane anyway. The encoder, the decoder and the 21-image
  # corpus under test/fixtures/differential are three pinned implementations of
  # one format, and a driver that silently stopped producing a readable artifact
  # would leave all three green while the thing they exist for was broken.
  differential:
    name: differential driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build
      - run: cmake --build build --target basalt_diff -j "$(nproc)"
      # ONE CLEAN RUN AND ONE KILLED RUN. A clean run is the control: an engine
      # that recovers nothing after an orderly close is broken in a way no crash
      # schedule is needed to find. A killed run is the case the rig exists for.
      - name: a clean run produces a parseable artifact
        run: |
          ./build/basalt_diff flush 1 > clean.diff
          test -s clean.diff
          head -c 7 clean.diff | grep -q RIFTDIF
      - name: a killed run produces a parseable artifact
        run: |
          ./build/basalt_diff flush 1 40 > killed.diff
          test -s killed.diff
          head -c 7 killed.diff | grep -q RIFTDIF
      # THE MAGIC IS CHECKED BY NAME, and `RIFTDIF` is not a typo -- see
      # rig/differential_artifact.h. It is a frozen format shared with a second
      # decoder and a committed corpus, and renaming it to match this library
      # would invalidate every artifact anyone has kept.

  # FORMAT IS CHECKED ON THE LINES A CHANGE TOUCHES, NEVER ON THE FILE.
  #
  # The tree predates .clang-format and has not been reformatted; see that file
  # for why it must not be. A whole-file check here would therefore be red on
  # every push forever, which is the same as having no check: a lane that is
  # always red is one people learn to merge past.
  #
  # `git clang-format --diff <base>` restricts formatting to the changed line
  # ranges and prints what it would change. Empty output is the pass.
  format:
    name: clang-format (changed lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: sudo apt-get update && sudo apt-get install -y clang-format

      # The merge base, not the base tip: comparing against the tip would
      # attribute every line the base moved on since the branch started to
      # this change.
      - name: resolve the merge base
        id: base
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base=$(git merge-base HEAD FETCH_HEAD)
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            base=$(git rev-parse HEAD~1)
          else
            base=$(git rev-parse HEAD)
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "comparing against $base"

      # The version is printed because it is a real variable: clang-format
      # output differs between major releases, so a contributor whose local
      # version is not this one can be told to reformat by a lane they cannot
      # reproduce. Printing it makes that visible in the log instead of
      # mysterious.
      - name: clang-format version
        run: clang-format --version

      - name: changed lines satisfy .clang-format
        run: |
          # THE STATUS IS TAKEN EXPLICITLY, and this is not defensive style.
          # `git clang-format --diff` exits 1 when it HAS a diff to report.
          # This step runs under `bash -e`, so assigning its output kills the
          # step AT THE ASSIGNMENT, before a single echo runs -- the lane goes
          # red having printed nothing about what it wanted changed. That is
          # how this lane first failed, and a check that cannot say what it
          # objects to is one people disable.
          set +e
          out=$(git clang-format --diff --extensions cc,h \
                  "${{ steps.base.outputs.sha }}" \
                  -- src include rig cmd test 2>&1)
          rc=$?
          set -e

          # 0 = nothing to change, 1 = a diff to report, anything else = the
          # tool itself failed and must not be read as a formatting verdict.
          if [ "$rc" -gt 1 ]; then
            echo "git clang-format failed with exit $rc:"
            echo "$out"
            exit "$rc"
          fi
          if [ "$rc" -eq 0 ]; then
            echo "changed lines are clean"
            echo "$out"
            exit 0
          fi
          echo "$out"
          echo
          echo "The lines this change touches do not match .clang-format."
          echo "Run: git clang-format ${{ steps.base.outputs.sha }}"
          exit 1

  # THE INSTALLED PACKAGE, CONSUMED FROM C BY A PROJECT THAT KNOWS NO C++.
  #
  # Every other job in this file builds targets that live in this build. That is
  # a different thing from what an embedder does, and the difference is not
  # cosmetic: an in-tree target inherits include paths, compile options and link
  # languages from the build that defines it, and an installed one carries only
  # what the export wrote down. Everything the export forgot works here and
  # fails there.
  #
  # THIS JOB EXISTS BECAUSE ITS FIRST RUN FAILED. `basalt` is a static archive
  # of C++ objects; a C executable linking it got several hundred undefined
  # std:: symbols, because a C compiler driver has no reason to add a C++
  # runtime and the export did not say one was needed. The library's first
  # consumer had hidden that by writing `-lstdc++` into its own source.
  #
  # It also exercises basaltConfigVersion.cmake, which no other job touches: the
  # consumer asks for `0.1` rather than for nothing at all, so a version file
  # that was wrong would fail here rather than being installed and never read.
  installed-c-consumer:
    name: installed package, consumed from C
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build and install the library
        run: |
          cmake -S . -B build-inst -DBASALT_BUILD_TESTS=OFF \
                -DCMAKE_INSTALL_PREFIX="$PWD/prefix"
          cmake --build build-inst -j "$(nproc)"
          cmake --install build-inst
      - name: the package installed a version file
        run: test -f prefix/lib/cmake/basalt/basaltConfigVersion.cmake
      - name: configure and build the C consumer against the prefix
        run: |
          cmake -S examples/c_consumer -B build-consumer \
                -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build build-consumer -j "$(nproc)"
      - name: run it
        run: ./build-consumer/basalt_c_consumer
      # A VERSION THIS RELEASE CANNOT SATISFY MUST BE REFUSED, and refusal is
      # the half of a version file that is easy to install broken: an
      # always-compatible one passes every job above without complaint.
      - name: a newer minor version is refused
        run: |
          sed -i 's/find_package(basalt 0.1 REQUIRED)/find_package(basalt 0.2 REQUIRED)/' \
              examples/c_consumer/CMakeLists.txt
          if cmake -S examples/c_consumer -B build-reject \
                   -DCMAKE_PREFIX_PATH="$PWD/prefix" >/dev/null 2>&1; then
            echo "find_package(basalt 0.2) was ACCEPTED by a 0.1.0 install"
            exit 1
          fi
          echo "0.2 correctly refused by a 0.1.0 install"

  # The library alone, with BASALT_BUILD_TESTS off: the configuration an
  # embedder gets from add_subdirectory. It must not need GoogleTest, and it
  # must not need anything under test/ or rig/.
  library-only:
    name: library only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-lib -DBASALT_BUILD_TESTS=OFF
      - run: cmake --build build-lib -j "$(nproc)"
      - run: test -f build-lib/libbasalt.a
      # THE C ABI IS PART OF THE LIBRARY AND NOT PART OF THE TEST TREE, so it
      # must be here too. If it were only ever built by the test configuration,
      # "basalt ships a C API" would be true of this repository and false of
      # what an embedder gets.
      - run: test -f build-lib/libbasalt_c.a
