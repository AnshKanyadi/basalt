# Four lanes across three toolchains: twelve jobs.
#
# The lanes are not variations on a theme. cpp-test is the UNINSTRUMENTED
# CONTROL that makes the other three mean something: without it, a red under
# ASan is not attributable, because "the code is broken" and "the code has a
# memory error" look identical in an exit code.
#
# Each lane asserts AT COMPILE TIME that it has the sanitizer it claims -- and
# cpp-test asserts it has none. See test/sanitizer_lane_test.cc. A lane that
# lost its -fsanitize flag to a CMake edit fails to BUILD rather than passing
# quietly, which is the failure mode a sanitizer lane is most exposed to: it
# keeps building, keeps running, keeps passing, and checks nothing at all.
#
# NO NETWORK IS NEEDED TO BUILD. GoogleTest is vendored at
# third_party/googletest. The checkout is the only fetch in this file.
#
# GCC WAS ADDED AND IT FOUND TWO THINGS IMMEDIATELY, which is the argument for
# it. libstdc++ does not pull <algorithm> in behind another header the way
# libc++ does, so a missing include compiled under clang for as long as clang
# was the only compiler; and -Wdangling-else, which clang does not raise here,
# named an unbraced `if (cond) EXPECT_TRUE(...)` -- a shape whose macro expands
# to an if/else. Both are fixed. Neither was reachable from a green clang run.
#
# The gcc TSan lane runs on Linux only because that is the only place it is in
# the matrix. Homebrew's macOS gcc ships libasan and libubsan but no libtsan,
# so a macOS gcc job could not have run it.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lanes:
    name: ${{ matrix.lane.name }} (${{ matrix.platform.os }}, ${{ matrix.platform.cc }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        # THREE TOOLCHAINS, BECAUSE THE STANDARD LIBRARY IS THE VARIABLE.
        # libstdc++ and libc++ do not agree about which headers include which
        # others, so a missing <algorithm> compiles on one and not the other.
        # That is not hypothetical here: it is what the first gcc build found.
        platform:
          - { os: ubuntu-latest, cc: clang, cxx: clang++ }
          - { os: ubuntu-latest, cc: gcc,   cxx: g++ }
          - { os: macos-latest,  cc: clang, cxx: clang++ }
        lane:
          # The control. It BUILDS the TSan harness and deliberately does not
          # run it: building it here is what makes this lane a real control for
          # cpp-tsan, so a red there is the race and not a broken build.
          # Running it here would defeat that -- the harness races on purpose
          # under an unlocked mutant, and cpp-test would go red too.
          - name: cpp-test
            sanitizer: none
            targets: basalt_test basalt_tsan_harness
            run: basalt_test
            opts: ''
          - name: cpp-asan
            sanitizer: address
            targets: basalt_test
            run: basalt_test
            opts: 'ASAN_OPTIONS=abort_on_error=0:detect_leaks=0'
          - name: cpp-ubsan
            sanitizer: undefined
            targets: basalt_test
            run: basalt_test
            opts: 'UBSAN_OPTIONS=print_stacktrace=1'
          # THE THREAD LANE RUNS THE HARNESS AND NOT THE UNIT SUITE. The unit
          # suite is single-threaded, so a green TSan run over it would report
          # the absence of threads as the absence of races.
          - name: cpp-tsan
            sanitizer: thread
            targets: basalt_tsan_harness
            run: basalt_tsan_harness
            opts: 'TSAN_OPTIONS=halt_on_error=1'
    env:
      CC: ${{ matrix.platform.cc }}
      CXX: ${{ matrix.platform.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: compiler version
        run: $CXX --version

      - name: configure
        run: cmake -S . -B build -DBASALT_SANITIZER=${{ matrix.lane.sanitizer }}

      # getconf rather than nproc: nproc is coreutils and is not on the macOS
      # runner.
      - name: build
        run: |
          cmake --build build --target ${{ matrix.lane.targets }} \
                -j "$(getconf _NPROCESSORS_ONLN)"

      - name: run
        run: env ${{ matrix.lane.opts }} ./build/${{ matrix.lane.run }}

  # FORMAT IS CHECKED ON THE LINES A CHANGE TOUCHES, NEVER ON THE FILE.
  #
  # The tree predates .clang-format and has not been reformatted; see that file
  # for why it must not be. A whole-file check here would therefore be red on
  # every push forever, which is the same as having no check: a lane that is
  # always red is one people learn to merge past.
  #
  # `git clang-format --diff <base>` restricts formatting to the changed line
  # ranges and prints what it would change. Empty output is the pass.
  format:
    name: clang-format (changed lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: sudo apt-get update && sudo apt-get install -y clang-format

      # The merge base, not the base tip: comparing against the tip would
      # attribute every line the base moved on since the branch started to
      # this change.
      - name: resolve the merge base
        id: base
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base=$(git merge-base HEAD FETCH_HEAD)
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            base=$(git rev-parse HEAD~1)
          else
            base=$(git rev-parse HEAD)
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "comparing against $base"

      # The version is printed because it is a real variable: clang-format
      # output differs between major releases, so a contributor whose local
      # version is not this one can be told to reformat by a lane they cannot
      # reproduce. Printing it makes that visible in the log instead of
      # mysterious.
      - name: clang-format version
        run: clang-format --version

      - name: changed lines satisfy .clang-format
        run: |
          # THE STATUS IS TAKEN EXPLICITLY, and this is not defensive style.
          # `git clang-format --diff` exits 1 when it HAS a diff to report.
          # This step runs under `bash -e`, so assigning its output kills the
          # step AT THE ASSIGNMENT, before a single echo runs -- the lane goes
          # red having printed nothing about what it wanted changed. That is
          # how this lane first failed, and a check that cannot say what it
          # objects to is one people disable.
          set +e
          out=$(git clang-format --diff --extensions cc,h \
                  "${{ steps.base.outputs.sha }}" \
                  -- src include rig cmd test 2>&1)
          rc=$?
          set -e

          # 0 = nothing to change, 1 = a diff to report, anything else = the
          # tool itself failed and must not be read as a formatting verdict.
          if [ "$rc" -gt 1 ]; then
            echo "git clang-format failed with exit $rc:"
            echo "$out"
            exit "$rc"
          fi
          if [ "$rc" -eq 0 ]; then
            echo "changed lines are clean"
            echo "$out"
            exit 0
          fi
          echo "$out"
          echo
          echo "The lines this change touches do not match .clang-format."
          echo "Run: git clang-format ${{ steps.base.outputs.sha }}"
          exit 1

  # The library alone, with BASALT_BUILD_TESTS off: the configuration an
  # embedder gets from add_subdirectory. It must not need GoogleTest, and it
  # must not need anything under test/ or rig/.
  library-only:
    name: library only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build-lib -DBASALT_BUILD_TESTS=OFF
      - run: cmake --build build-lib -j "$(nproc)"
      - run: test -f build-lib/libbasalt.a
